<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>TabTidy 本机同步</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head>
<body>
  <div class="brand">▤ TabTidy</div>
  <h1>连接你的桌面应用</h1>
  <p>在 TabTidy 桌面端复制连接码，粘贴到下方。标签页信息只发送到本机。</p>
  <form id="connect-form">
    <label for="code">本机连接码</label>
    <input id="code" type="password" autocomplete="off" spellcheck="false" required placeholder="粘贴 32 位连接码">
    <button id="sync" type="submit">配对并同步标签页</button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
  <small>只需首次配对，以后自动连接。桌面端暂未打开时会自动重试，标签页变化时自动同步。</small>
</body>
</html>
